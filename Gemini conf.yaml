mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090
geodata-mode: true
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/geoip.dat
  geosite: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/geosite.dat
  mmdb: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/country.mmdb

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  nameserver:
    - 119.29.29.29
    - 114.114.114.114
    - 223.5.5.5
    - 8.8.8.8
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - https://cloudflare-dns.com/dns-query
  fake-ip-filter:
    - '*.local'
    - localhost
    - '*.lan'
    - '*.qq.com'
    - '*.apple.com'
    - '*.icloud.com'
    - '*.stun.playstation.net'
    - '*.xboxlive.com'


proxy-providers:


proxy-groups:
  - name: Hong Kong
    type: select
    use:
      - liangxin
    filter: "(?=.*(🇭🇰|香港|HK|(?i)Hong))^((?!(beup|手游|游戏(?i)Game)).)*$"
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png

  - name: Taiwan
    type: select
    use:
      - liangxin
    filter: "(?=.*((?i)🇨🇳|台|台湾|台北|新北|桃园|台中|台南|高雄|基隆|新竹|嘉义|苗栗|彰化|南投|云林|屏东|台东|花莲|宜兰|澎湖|金门|连江|TW|Taiwan))^((?!(港|日|韩|新|美|英|平|邀|群|刷新|网|网易|网易云|网易云音乐|音乐|云音乐|Netease|Music|𝐌𝐮𝐬𝐢𝐜|Unbolck|Update|music|🎵|🎶|🎧)).)*$"
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/China.png

  - name: Japan
    type: select
    use:
      - liangxin
    filter: "(?=.*(日本|东京|東京|大阪|JP|(?i)Japan))^((?!(手游|游戏(?i)Game)).)*$"
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Japan.png

  - name: Korea
    type: select
    use:
      - liangxin
    filter: "(?=.*(🇰🇷|首尔|春川|韩国|韩|KR|(?i)Korea))^((?!(🇺🇦|游戏(?i)Game)).)*$"
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Korea.png

  - name: Singapore
    type: select
    use:
      - liangxin
    filter: "(?=.*((?i)🇸🇬|新|狮|獅|坡|新加坡|星|星加坡|星洲|狮城|SG|Singapore))^((?!(订阅|港|台|日|韩|美|英|平|邀|群|刷新|网|网易|网易云|网易云音乐|音乐|云音乐|Netease|Music|𝐌𝐮𝐬𝐢𝐜|Unbolck|Update|music|🎵|🎶|🎧)).)*$"
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Singapore.png

  - name: United States
    type: select
    use:
      - liangxin
    filter: "(?=.*((?i)🇺🇸|美|美国|美利坚合众国|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|华盛顿|内华达|蒙大纳|怀拥明州|菲尼克斯|阿尔伯克基|丹佛|US|United States|States|American))^((?!(港|台|日|韩|新|英|平|邀|群|刷新|网|网易|网易云|网易云音乐|音乐|云音乐|Netease|Music|𝐌𝐮𝐬𝐢𝐜|Unbolck|Update|music|🎵|🎶|🎧)).)*$"
